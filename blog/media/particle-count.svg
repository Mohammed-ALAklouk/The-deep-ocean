<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img" aria-label="Target particle count against depth: ramps to 300 by about 305 metres, holds flat to 5000 metres, tapers on a power curve and reaches zero at 8000 metres, leaving the last 2924 metres empty.">
  <defs>
    <style>
      .panel { fill: #f6f9fb; stroke: hsl(200 30% 88%); stroke-width: 1; }
      .ink   { fill: hsl(220 45% 11%); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .muted { fill: hsl(199 20% 45%); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .mono  { font-family: ui-monospace, SFMono-Regular, Consolas, "Courier New", monospace; }
      .sm    { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; }
      .xs    { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; }
      .hdr   { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 600; }
      .axis  { stroke: hsl(199 20% 70%); stroke-width: 1; }
      .grid  { stroke: hsl(200 25% 90%); stroke-width: 1; }
    </style>
    <!-- depth wash: surface light on the left, trench black on the right -->
    <linearGradient id="depth" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"    stop-color="hsl(188 58% 84%)"/>
      <stop offset="1.8%"  stop-color="hsl(199 90% 58%)"/>
      <stop offset="9.2%"  stop-color="hsl(200 88% 34%)"/>
      <stop offset="36.6%" stop-color="hsl(210 60% 18%)"/>
      <stop offset="54.9%" stop-color="hsl(225 40% 8%)"/>
      <stop offset="100%"  stop-color="hsl(225 40% 4%)"/>
    </linearGradient>
    <linearGradient id="under" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="hsl(165 92% 50%)" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="hsl(165 92% 50%)" stop-opacity="0.06"/>
    </linearGradient>
  </defs>

  <rect class="panel" x="8" y="8" width="864" height="404" rx="10"/>
  <text class="ink hdr" x="24" y="32">How many particles exist at a given depth</text>
  <text class="muted sm" x="24" y="50">a target count, not a spawn rate — the deficit is filled at once, pre-aged</text>

  <!-- plot background: depth wash, kept faint so the curve stays the subject -->
  <rect x="90" y="72" width="740" height="268" fill="url(#depth)" opacity="0.16" rx="2"/>

  <g class="grid">
    <line x1="90" y1="90"  x2="830" y2="90"/>
    <line x1="90" y1="173" x2="830" y2="173"/>
    <line x1="90" y1="256" x2="830" y2="256"/>
  </g>

  <!-- area + curve -->
  <path fill="url(#under)" d="M90,340 L90.3,340 L110.7,90 L428.7,90
        C462.6,149.8 496.4,203.9 530.3,251.6 C564.2,291.9 598.1,323 631.9,340 L830,340 Z"/>
  <path fill="none" stroke="hsl(172 62% 30%)" stroke-width="2.8" stroke-linejoin="round"
        d="M90,340 L90.3,340 L110.7,90 L428.7,90
           C462.6,149.8 496.4,203.9 530.3,251.6 C564.2,291.9 598.1,323 631.9,340 L830,340"/>

  <!-- axes -->
  <line class="axis" x1="90" y1="340" x2="838" y2="340"/>
  <line class="axis" x1="90" y1="72"  x2="90"  y2="340"/>

  <g class="muted sm">
    <text x="82" y="94"  text-anchor="end">300</text>
    <text x="82" y="177" text-anchor="end">200</text>
    <text x="82" y="260" text-anchor="end">100</text>
    <text x="82" y="344" text-anchor="end">0</text>
    <text x="90"    y="358" text-anchor="middle">0</text>
    <text x="428.7" y="358" text-anchor="middle">5,000</text>
    <text x="631.9" y="358" text-anchor="middle">8,000</text>
    <text x="830"   y="358" text-anchor="middle">10,924</text>
    <text x="464"   y="380" text-anchor="middle">depth (metres)</text>
  </g>
  <text class="muted sm" x="30" y="206" transform="rotate(-90 30 206)" text-anchor="middle">particles on screen</text>

  <!-- zone ticks along the axis -->
  <g class="axis">
    <line x1="103.5" y1="340" x2="103.5" y2="345"/>
    <line x1="157.7" y1="340" x2="157.7" y2="345"/>
    <line x1="361"   y1="340" x2="361"   y2="345"/>
    <line x1="496.4" y1="340" x2="496.4" y2="345"/>
  </g>
  <g class="muted xs" text-anchor="middle">
    <text x="259" y="332">midnight</text>
    <text x="663" y="332" fill="hsl(199 20% 58%)">hadal</text>
  </g>

  <!-- markers -->
  <g class="axis" stroke-dasharray="4 4">
    <line x1="428.7" y1="90"  x2="428.7" y2="340"/>
    <line x1="631.9" y1="102" x2="631.9" y2="340"/>
  </g>

  <!-- callouts -->
  <g>
    <rect x="124" y="106" width="188" height="46" rx="7" fill="#ffffff" stroke="hsl(200 25% 85%)"/>
    <text class="ink sm" x="136" y="125">ramps in over ~305 m</text>
    <text class="muted sm" x="136" y="142">no wall of dust at the surface</text>

    <rect x="344" y="132" width="178" height="46" rx="7" fill="#ffffff" stroke="hsl(200 25% 85%)"/>
    <text class="ink sm" x="356" y="151">taper starts at 5,000 m</text>
    <text class="muted sm" x="356" y="168">on a ^1.5 curve, not a cliff</text>

    <rect x="646" y="196" width="196" height="62" rx="7" fill="hsl(225 40% 11%)"/>
    <text fill="hsl(190 28% 92%)" font-family="system-ui, sans-serif" font-size="11.5" x="658" y="217">zero from 8,000 m down</text>
    <text fill="hsl(199 20% 68%)" font-family="system-ui, sans-serif" font-size="11.5" x="658" y="235">the last 2,924 m are empty,</text>
    <text fill="hsl(199 20% 68%)" font-family="system-ui, sans-serif" font-size="11.5" x="658" y="251">on purpose</text>
  </g>
</svg>
